name: Automatic retraining

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Retrain model
        run: python -m src.roadrisk.train
      - name: Smoke test API
        run: pytest -q
      - name: Publish retrained model artifact
        uses: actions/upload-artifact@v4
        with:
          name: roadrisk-retrained-${{ github.run_number }}
          path: |
            models/
            data/processed/
            reports/figures/
