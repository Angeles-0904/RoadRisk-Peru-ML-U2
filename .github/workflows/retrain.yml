name: Automatic retraining

# Pipeline de mantenimiento: se ejecuta diariamente (05:00 UTC) y de forma
# manual desde GitHub Actions. Flujo: cargar datos -> limpiar -> entrenar
# (supervisado como retador) -> comparar campeon vs retador -> registrar la
# mejor version -> reentrenar clustering -> monitorear deriva -> publicar artefactos.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Retrain + compare supervised model (champion vs challenger)
        run: python -m src.roadrisk.retrain
      - name: Retrain unsupervised model (K-Means)
        run: python -m src.roadrisk.train_clustering
      - name: Run monitoring drift check
        run: python -m src.roadrisk.monitoring
      - name: Smoke test API
        run: pytest -q
      - name: Publish retrained model artifact
        uses: actions/upload-artifact@v4
        with:
          name: roadrisk-retrained-${{ github.run_number }}
          path: |
            models/
            data/processed/
            reports/figures/
            reports/monitoring/
            reports/retraining/
